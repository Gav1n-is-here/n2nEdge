plugins { id 'com.android.application' }
android {
    namespace 'wang.switchy.hin2n'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'dev.gav1n.n2n'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.3.1'
        testInstrumentationRunner 'wang.switchy.hin2n.SmokeRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'; universalApk true } }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'com.google.android.material:material:1.13.0' }
